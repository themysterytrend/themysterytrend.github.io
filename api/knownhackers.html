<html>
  <body>
    <p id='text'></p>
    <script>
      function loadFile(filePath) {
        var result = null;
        var xmlhttp = new XMLHttpRequest();
        xmlhttp.open("GET", filePath, false);
        xmlhttp.send();
        if (xmlhttp.status==200) {
          result = xmlhttp.responseText;
        }
        return result;
      }
    </script>
    <script>
      var url = new URL(window.location);
      var uuid = url.searchParams.get("uuid");

      var hackers = loadFile("/api/hackerdb");

      function run() {
        if(uuid === null) {
          document.getElementById('text').textContent = hackers;
          console.log(hackers);
          return;
        }
  
        var uuidList = hackers.split("\n");
        
        for(var i = 0; i < uuidList.length; i++) {
          if(uuidList[i] === uuid) {
            document.getElementById('text').textContent('true');
            console.log('true');
            return;
          }
        }
  
        document.getElementById('text').textContent('false');
        console.log('false');
      }

      run();
      
      
      
    </script>
  </body>  
</html>
